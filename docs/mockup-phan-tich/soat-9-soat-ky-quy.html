const THANG = { Q1: 'T01 – T03', Q2: 'T04 – T06', Q3: 'T07 – T09', Q4: 'T10 – T12' }
const daiKy = KY.map(([k, t]) => { const [n, m, nen] = TT_KY[t], mo = k === MO

    <div class="leading-tight"><p class="text-[11px] text-gray-500">${THANG[k]}/2026</p><p class="text-xs font-semibold flex items-center gap-1" style="color:${m}"><span class="w-1.5 h-1.5 rounded-full" style="background:${m}"></span>${n}</p></div></div>` }).join('')
const KQ = { khop: ['Khớp', 'xanhLa'], lech: ['Có chênh lệch', 'hoPhach'], thieu: ['Thiếu hồ sơ', 'do'] }
// [nhóm, màu, kiểm tra, số 1, nguồn 1, số 2, nguồn 2, chênh lệch, kết quả]
const dong = [
  ['GTGT đầu ra', '#059669', '[34] tờ khai ↔ bảng kê cổng bán ra', 9.6e9, 'Tờ khai Q3 (chưa nộp)', 9.65e9, 'Bảng kê cổng · 96 HĐ', -50e6, 'lech'],

]

const oCl = (cl, kq) => typeof cl === 'string'

  : `<span class="text-sm font-bold tabular-nums text-amber-800">${Math.abs(cl) < 1000 ? cl.toLocaleString('vi-VN') + ' người' : so(cl)}</span>`
const hang = dong.map(([nh, m, kt, a, na, b, nb, cl, kq]) => `<tr>

]

const ctHd = [
  ['Bán ra · chưa có trong tờ khai', '#059669', '29/09/2026', '1C26TAB · 0000731', 'CÔNG TY TNHH NỘI THẤT HẢI MINH · MST 0377712345', 50e6, 5e6],
  ['Mua vào · chưa có trong phần mềm', '#7C3AED', '30/09/2026', '1C26TPL · 0002214', 'CÔNG TY CP THIẾT BỊ PHƯỚC LỘC · MST 0322222222', 84e6, 8.4e6],
]
trang({ dangMo: 'soat', icon: '🔎', tieuDe: 'Soát xét báo cáo', tabs: TABS_SOAT, tabMo: 'Soát kỳ', nam: 2026, cty: CTY, noiDung: `
  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm px-4 py-3 mb-4">
    <div class="flex items-center gap-3 mb-2.5 flex-wrap"><p class="text-sm font-bold text-gray-800">Kỳ khai năm 2026: Quý (cả năm)</p>
      <span class="text-[11px] rounded-full px-2.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-200 font-semibold">Theo tờ khai · doanh thu 2025 = 38,4 tỷ, từ 50 tỷ trở xuống</span>
      <span class="text-[11px] rounded-full px-2.5 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-200 font-semibold">✓ Hồ sơ công ty trên app: Quý — khớp</span>
      <span class="ml-auto text-[11px] text-gray-500">Kỳ khai cố định trọn năm · trạng thái tính từ thư mục, không lưu</span></div>
    <div class="flex items-center gap-3">${daiKy}</div></div>
  <div class="rounded-2xl px-4 py-3 mb-4 flex items-center gap-4 text-white shadow-sm" style="background:linear-gradient(90deg,#B45309,#D97706 55%,#F59E0B)">
    <span class="text-2xl">📝</span>
    <div><p class="text-sm font-bold">Đang soát BẢN CHƯA NỘP · tờ khai 01/GTGT quý 3/2026</p>
      <p class="text-xs text-white/90 font-mono">BAOCAOTHUE_Q3_2026_ANBINH\\BẢNG KÊ\\TK_GTGT_Q3.2026.xml · xuất từ HTKK 24/10/2026 16:05</p></div>
    <div class="ml-auto text-right"><p class="text-xs text-white/85">Hạn nộp</p><p class="text-lg font-extrabold leading-tight">31/10/2026 · còn 5 ngày</p><p class="text-[11px] text-white/85">Phân hệ Tờ khai: chưa có hồ sơ nộp kỳ này</p></div></div>
  <div class="grid grid-cols-4 gap-3 mb-4">
    ${oTong(16, 'Phép kiểm tra trong kỳ', 'xanhDuong')}${oTong(12, 'Khớp', 'xanhLa')}${oTong(4, 'Có chênh lệch', 'hoPhach', 'đầu ra, đầu vào, tiền mặt, C12')}${oTong(0, 'Thiếu hồ sơ', 'xam', 'đủ 9/9 hồ sơ của kỳ')}</div>
  <div class="grid grid-cols-5 gap-4 mb-5">
    <div class="col-span-3 bg-white rounded-2xl border border-gray-100 shadow-sm">
      <div class="px-4 py-2.5 border-b border-gray-100 text-sm font-semibold text-gray-700">Hồ sơ kỳ Q3/2026 · đủ 9/9</div>
      <div class="px-4 py-3 grid grid-cols-2 gap-x-6 gap-y-2">${hoSo.map(([n, c]) => `<div class="flex items-center gap-2 text-xs"><span class="w-5 h-5 flex-shrink-0 rounded-full flex items-center justify-center text-[11px] font-bold text-white" style="background:${c ? '#059669' : '#DC2626'}">${c ? '✓' : '!'}</span><span class="${c ? 'text-gray-700' : 'text-red-700 font-semibold'}">${n}</span></div>`).join('')}</div></div>
    <div class="col-span-2 bg-white rounded-2xl border border-gray-100 shadow-sm">
      <div class="px-4 py-2.5 border-b border-gray-100 text-sm font-semibold text-gray-700 flex items-center">Rủi ro thuế · lũy kế đến Q3/2026<span class="ml-auto text-[10px] font-semibold text-amber-800 bg-amber-50 border border-amber-200 rounded-full px-2 py-0.5">Tạm tính</span></div>
      <div class="px-4 py-2 grid grid-cols-2 gap-x-5">${luyKe.map(([id, t, v]) => `<div class="flex items-center gap-2 py-1 text-xs border-b border-gray-50"><span class="font-mono font-bold" style="color:${DO}">${id}</span><span class="text-gray-700 flex-1 truncate">${t}</span><span class="font-semibold tabular-nums ${v === 'khớp' ? 'text-gray-400' : 'text-slate-800'}">${v}</span></div>`).join('')}</div>
      <div class="px-4 pb-3 flex items-center gap-2"><p class="text-[11px] text-gray-500">33 tiêu chí còn lại chờ BCTC / quyết toán.</p><button class="ml-auto px-3 py-1 rounded-xl text-xs text-white whitespace-nowrap" style="background:${DO}">Mở Rủi ro thuế · lũy kế</button></div></div>

    <div class="px-4 py-2.5 border-b border-gray-100 text-sm font-semibold text-gray-700">Chi tiết · 2 hóa đơn trên cổng chưa có trong tờ khai / phần mềm</div>
    <table class="w-full text-sm"><tbody>${ctHd.map(([nhan, m, ng, kh, dt, tien, thue]) => `
      <tr><td class="px-4 w-60"><span class="inline-block rounded-lg px-2 py-0.5 text-[11px] font-semibold text-white whitespace-nowrap" style="background:${m}">${nhan}</span></td><td class="px-3 text-xs">${ng}</td><td class="px-3 text-xs font-mono">${kh}</td><td class="px-3 text-xs">${dt}</td><td class="px-3 text-right text-xs tabular-nums">${so(tien)}</td><td class="px-3 text-right text-xs tabular-nums font-semibold">${so(thue)}</td><td class="px-4">${nguon('excel')}</td></tr>`).join('')}
