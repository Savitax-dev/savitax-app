<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>11 · Hồ sơ · Bàn giao & Đóng</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="_khung.js"></script></head>
<body><script>
// Bước 9–10: biên bản bàn giao, điều kiện đóng hồ sơ, gói lưu trữ Drive theo cây 1 → 8, lịch xoá ảnh CCCD.
const h = HO_SO[5]
const giao = [['Giấy xác nhận tạm ngừng kinh doanh (bản gốc)', 1, true], ['Thông báo của cơ quan thuế về tạm ngừng', 1, true], ['Biên nhận hồ sơ của Phòng ĐKKD', 1, true], ['Bản sao bộ hồ sơ đã nộp (PDF)', 1, false]]
const dk = [
  [true, 'Đã có kết quả của cơ quan', 'GXN tạm ngừng ngày 18/10/2026'],
  [true, 'Đã thu đủ tiền', '1.800.000 / 1.800.000'],
  [false, 'Biên bản bàn giao có chữ ký khách', 'chưa tải bản scan BBBG đã ký'],
  [true, 'Đủ bản scan hồ sơ đã nộp', '4/4 tệp'],
  [true, 'Checklist các bước hoàn tất', '18/18 việc'],
]
const cay = [
  ['1. THÔNG TIN KHÁCH HÀNG', 3, 'CCCD (ảnh lưu riêng, không chép lên Drive), GPKD'], ['2. BÁO GIÁ', 1, ''], ['3. ĐNTT', 1, ''],
  ['4. SOẠN HỒ SƠ', 6, 'Word + PDF bản cuối'], ['5. TRÌNH KÝ', 1, 'bộ trình ký PDF'], ['6. SCAN', 4, ''], ['7. KẾT QUẢ', 2, 'GXN, biên nhận'], ['8. BÀN GIAO', 0, 'chờ BBBG đã ký'],
]

trang({ dangMo: 'hoso', icon: '📂', tieuDe: 'Chi tiết hồ sơ', noiDung: `
  ${dauHoSo(h, `${nut('🖨️ In BBBG')}${nut('🔒 Đóng hồ sơ', 'chinh', 'opacity-50')}`)}
  ${tabDeu(TAB_HO_SO, 'Bàn giao & Đóng')}
  <div class="grid grid-cols-[1.15fr_1fr] gap-4">
    <div class="space-y-4">
      <div class="khung"><div class="khung-dau"><h2>Biên bản bàn giao</h2><span class="ml-auto flex gap-2">${nut('W Word', 'phu', 'text-xs py-1')}${nut('PDF', 'phu', 'text-xs py-1')}</span></div>
        <div class="p-4 grid grid-cols-3 gap-3">
          <div><span class="nhan">Ngày bàn giao</span><div class="o">31/10/2026</div></div>
          <div><span class="nhan">Người nhận (phía khách)</span><div class="o">Lý Văn Đông · Giám đốc</div></div>
          <div><span class="nhan">Hình thức</span><div class="o">Giao tận tay ▾</div></div>
          <div class="col-span-3"><table class="bang"><thead><tr><th>Tài liệu giao</th><th class="so">Số bản</th><th class="text-center">Giao</th></tr></thead><tbody>
            ${giao.map(([t, b, c]) => `<tr><td>${t}</td><td class="so">${b}</td><td class="text-center">${c ? '☑' : '☐'}</td></tr>`).join('')}</tbody></table></div>
          <div class="col-span-3 rounded-lg border-2 border-dashed border-amber-300 bg-amber-50 px-3 py-3 text-[13px] text-amber-900 flex items-center gap-3"><span class="text-xl">⤒</span><div><b>Tải bản scan BBBG đã ký</b><p class="text-[12px]">Bắt buộc trước khi đóng hồ sơ · lưu vào 8. BÀN GIAO</p></div></div>
        </div></div>

      <div class="khung"><div class="khung-dau"><h2>Điều kiện đóng hồ sơ</h2><span class="ml-auto">${chip('4/5 đạt', 'cam')}</span></div>
        <div class="p-3 space-y-1.5">${dk.map(([ok, t, g]) => `<div class="flex items-center gap-3 rounded-lg px-3 py-2 border ${ok ? 'border-emerald-200 bg-emerald-50' : 'border-red-200 bg-red-50'}"><span class="font-bold ${ok ? 'text-emerald-700' : 'text-red-700'}">${ok ? '✓' : '✕'}</span><p class="text-[13px] font-semibold">${t}</p><span class="ml-auto text-[12px] text-gray-600">${g}</span></div>`).join('')}
          <p class="text-[11.5px] text-gray-500 pt-1">Còn nợ mà vẫn cần đóng: chỉ <b>Trưởng phòng</b> bấm "Đóng còn nợ" + ghi lý do; số còn lại tiếp tục theo dõi ở báo cáo công nợ.</p></div></div>
    </div>

    <div class="space-y-4">
      <div class="khung"><div class="khung-dau"><h2>Lưu trữ trên Drive</h2><span class="ml-auto text-xs text-gray-500">Shared drive pháp lý</span></div>
        <div class="p-4 font-mono text-[12.5px]">
          <p class="text-gray-500">📁 PHÁP LÝ \\ 2026 \\</p>
          <p class="font-semibold">📁 09.10.2026_DONGHAI_TN_2TV</p>
          ${cay.map(([t, n, g]) => `<div class="flex items-center gap-2 pl-5 py-0.5"><span>${n ? '📂' : '📁'}</span><span>${t}</span><span class="font-sans text-[11px] rounded px-1.5 ${n ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-gray-50 text-gray-400 border border-gray-200'}">${n} tệp</span>${g ? `<span class="font-sans text-[11px] text-gray-400">${g}</span>` : ''}</div>`).join('')}
          <div class="font-sans mt-3 flex gap-2">${nut('↗ Mở thư mục Drive', 'phu', 'text-xs py-1')}${nut('☁️ Đồng bộ lại', 'phu', 'text-xs py-1')}</div></div></div>

      <div class="khung"><div class="khung-dau"><h2>Sau khi đóng</h2></div>
        <div class="p-4 text-[13px] space-y-2.5">
          <div class="flex gap-3"><span>🔒</span><p>Hồ sơ <b>khoá sửa</b>. Chỉ trưởng phòng mở lại được, bắt buộc ghi lý do.</p></div>
          <div class="flex gap-3"><span>🪪</span><p>Ảnh CCCD (3 ảnh) <b>tự xoá ngày 31/10/2028</b> — 24 tháng sau ngày đóng. Số liệu đã nhập vẫn giữ để tra cứu.</p></div>
          <div class="flex gap-3"><span>🔁</span><p>Doanh nghiệp vẫn ở danh sách — lần sau làm thay đổi / hoạt động lại thì <b>dùng lại thông tin</b>, không nhập lại từ đầu.</p></div>
          <div class="flex gap-3"><span>📊</span><p>Hồ sơ vào báo cáo "đã hoàn thành" của tháng đóng; doanh số vẫn theo tháng khách trả tiền.</p></div></div></div>
    </div>
  </div>` })
</script></body></html>
