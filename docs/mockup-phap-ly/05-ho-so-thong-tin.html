<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>05 · Hồ sơ · Thông tin</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="_khung.js"></script></head>
<body><script>
// Tab Thông tin pháp nhân: nhập MỘT lần, mọi giấy tờ lấy từ đây. Ô xanh = app tự điền/tự tính,
// ô vàng = cần xem lại, ô đỏ = bắt buộc còn trống. Cột phải: "Còn thiếu gì để xuất bộ hồ sơ".
const h = HO_SO[0]
const o = (nhan, gt, kieu = '', rong = 1, ghi = '') => `<div style="grid-column:span ${rong}"><span class="nhan">${nhan}</span><div class="o ${kieu}">${gt || '&nbsp;'}</div>${ghi ? `<p class="text-[11px] mt-0.5 ${kieu === 'thieu' ? 'text-red-700' : 'text-gray-500'}">${ghi}</p>` : ''}</div>`
const chon = (nhan, gt, kieu = '', rong = 1, ghi = '') => o(nhan, `<span class="flex justify-between"><span>${gt}</span><span class="text-gray-400">▾</span></span>`, kieu, rong, ghi)

const thieu = [
  ['do', 'Tỷ lệ góp vốn của chủ sở hữu', 'Tab Người & CCCD'],
  ['do', 'Chưa chọn ngành chính', 'Tab Ngành nghề'],
  ['cam', 'Email doanh nghiệp để trống', 'Không bắt buộc — Mẫu 2 sẽ để trống dòng này'],
  ['la', 'CCCD chủ sở hữu đã đọc & kiểm chéo khớp', ''],
  ['la', 'Địa chỉ trụ sở đúng đơn vị hành chính mới', ''],
]

trang({ dangMo: 'hoso', icon: '📂', tieuDe: 'Chi tiết hồ sơ', noiDung: `
  ${dauHoSo(h)}
  ${tabDeu(TAB_HO_SO, 'Thông tin')}
  <div class="grid grid-cols-[1fr_300px] gap-4">
    <div class="space-y-4">
      <div class="khung"><div class="khung-dau"><h2>Tên doanh nghiệp</h2></div>
        <div class="p-4 grid grid-cols-3 gap-3">
          ${o('Tên tiếng Việt *', 'CÔNG TY TNHH THƯƠNG MẠI DỊCH VỤ AN PHÚ LỘC', '', 2)}
          ${o('Tên viết tắt', 'AN PHU LOC TRADING CO., LTD', 'tu-dien', 1, 'app gợi ý từ tên tiếng nước ngoài')}
          ${o('Tên tiếng nước ngoài', 'AN PHU LOC TRADING SERVICE COMPANY LIMITED', 'tu-dien', 3, 'app gợi ý — chuyên viên sửa nếu khách muốn tên khác')}
        </div></div>

      <div class="khung"><div class="khung-dau"><h2>Trụ sở chính</h2><span class="ml-auto text-xs text-gray-500">Đơn vị hành chính 2 cấp (sau sáp nhập 2025)</span></div>
        <div class="p-4 grid grid-cols-4 gap-3">
          ${o('Số nhà, đường, tổ/ấp', '128/7 đường Lê Văn Sỹ', '', 2, 'ngõ/hẻm/ấp… viết thường giữa địa chỉ — app tự sửa khi xuất')}
          ${chon('Phường / xã *', 'Phường Nhiêu Lộc', '', 1)}
          ${chon('Tỉnh / thành phố *', 'TP. Hồ Chí Minh', '', 1)}
          ${o('Địa chỉ đầy đủ (tự ghép)', '128/7 đường Lê Văn Sỹ, Phường Nhiêu Lộc, Thành phố Hồ Chí Minh, Việt Nam', 'tu-dien khoa', 4)}
          ${o('Điện thoại', '0283 9xx 1122')}${o('Email', '', 'can-xem', 1, 'không bắt buộc')}${o('Website', '')}${o('Fax', '')}
        </div></div>

      <div class="grid grid-cols-2 gap-4">
        <div class="khung"><div class="khung-dau"><h2>Cơ quan quản lý</h2></div>
          <div class="p-4 grid grid-cols-1 gap-3">
            ${chon('Phòng Đăng ký kinh doanh', 'Phòng ĐKKD — Sở Tài chính TP. Hồ Chí Minh', 'tu-dien', 1, 'tự theo tỉnh của trụ sở')}
            ${chon('Cơ quan thuế quản lý', 'Thuế cơ sở 3 TP. Hồ Chí Minh · mã 79xxx', 'can-xem', 1, 'app gợi ý theo phường — danh mục chờ anh duyệt nguồn')}
          </div></div>
        <div class="khung"><div class="khung-dau"><h2>Vốn & lao động</h2></div>
          <div class="p-4 grid grid-cols-2 gap-3">
            ${o('Vốn điều lệ (VNĐ) *', '1.000.000.000')}${o('Số lao động dự kiến', '3')}
            ${o('Vốn bằng chữ', 'Một tỷ đồng', 'tu-dien khoa', 2, 'tự tính từ ô số')}
            ${chon('Tài sản góp vốn', 'Đồng Việt Nam', '', 2)}
          </div></div>
      </div>

      <div class="khung"><div class="khung-dau"><h2>Thông tin cho hồ sơ thuế</h2><span class="ml-auto text-xs text-gray-500">điền sau khi có MST cũng được — bước 8 mới bắt buộc</span></div>
        <div class="p-4 grid grid-cols-4 gap-3">
          ${o('Mã số thuế', '', 'khoa', 1, 'tự điền khi nhập kết quả (bước 7)')}${o('Ngày cấp', '', 'khoa')}
          ${chon('Hình thức kế toán', 'Kế toán theo TT133')}${chon('Phương pháp tính thuế GTGT', 'Khấu trừ')}
          ${o('Tài khoản ngân hàng', '1xx 456 789 · ACB CN Tân Định', '', 2)}${chon('Hình thức hóa đơn', 'Hóa đơn điện tử có mã')}${chon('Khấu hao TSCĐ', 'Đường thẳng')}
        </div></div>
    </div>

    <div class="space-y-4">
      <div class="khung"><div class="khung-dau"><h2>Đủ dữ liệu để xuất?</h2></div>
        <div class="px-4 pt-3 pb-1"><div class="flex items-end gap-2"><p class="text-3xl font-bold" style="color:${DO}">2</p><p class="text-sm text-gray-600 pb-1">mục bắt buộc còn thiếu</p></div>
          <div class="h-2 rounded-full bg-gray-100 mt-2"><div class="h-full rounded-full" style="width:86%;background:#047857"></div></div><p class="text-[11px] text-gray-500 mt-1">43/45 trường cho bộ Sở bước 1</p></div>
        <div class="p-3 space-y-1.5">${thieu.map(([m, t, g]) => `<div class="flex gap-2 rounded-lg border px-2.5 py-1.5 ${MAU[m]}"><span>${m === 'la' ? '✓' : m === 'do' ? '✕' : '!'}</span><div><p class="text-[12.5px] font-semibold">${t}</p>${g ? `<p class="text-[11px] opacity-80">${g}</p>` : ''}</div></div>`).join('')}</div></div>
      <div class="khung p-4 text-[12px] text-gray-600 space-y-1.5">
        <p class="font-semibold text-gray-800">Chú thích ô</p>
        <p><span class="inline-block w-3 h-3 rounded align-middle bg-emerald-100 border border-emerald-300"></span> app tự điền / tự tính</p>
        <p><span class="inline-block w-3 h-3 rounded align-middle bg-amber-100 border border-amber-300"></span> cần xem lại</p>
        <p><span class="inline-block w-3 h-3 rounded align-middle bg-red-100 border border-red-300"></span> bắt buộc, còn trống</p>
        <p class="pt-1 border-t">Sửa ở đây rồi bấm <b>Xuất lại</b> — mọi giấy tờ cập nhật theo, không phải sửa từng file Word.</p></div>
    </div>
  </div>` })
</script></body></html>
