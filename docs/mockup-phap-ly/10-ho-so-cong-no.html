<!doctype html>

<script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="_khung.js"></script></head>

// phần thu hộ / phần dịch vụ — khách trả thiếu thì trừ thu hộ trước. Doanh số tính theo ngày khách trả.
const h = HO_SO[0]
const phi = [
  ['dich_vu', 'Phí dịch vụ thành lập công ty TNHH 1TV', 3700000],
  ['thu_ho', 'Lệ phí đăng ký doanh nghiệp', 50000],
  ['thu_ho', 'Khắc dấu tròn công ty', 450000],
  ['thu_ho', 'Chữ ký số 1 năm', 1650000],
]

  ['Đợt 1', 'Khi nhận hồ sơ', '24/10/2026', 1850000, 2150000, 4000000, 'du'],
  ['Đợt 2', 'Khi có kết quả (bước 7)', 'chưa tới', 1850000, 0, 0, 'chua'],
]
const so = [['24/10/2026', 'Đợt 1', 'Chuyển khoản ACB', 4000000, 2150000, 1850000, 'Đỗ Hoài An', 'ĐNTT đợt 1, QR khớp']]

trang({ dangMo: 'hoso', icon: '📂', tieuDe: 'Chi tiết hồ sơ', noiDung: `
  ${dauHoSo(h)}
  ${tabDeu(TAB_HO_SO, 'Công nợ')}
  <div class="grid grid-cols-5 gap-3 mb-4">
    ${oTong('5.850.000', 'Tổng phải thu', 'xam', 'dịch vụ 3,7 tr + thu hộ 2,15 tr')}
    ${oTong('4.000.000', 'Đã thu', 'la', '1 lần thu · 24/10')}
    ${oTong('1.850.000', 'Còn lại', 'cam', 'đợt 2 — chưa đến hạn')}
    ${oTong('1.850.000', 'Doanh số đã ghi nhận', 'xanh', 'T10/2026 · trước VAT 1.712.963')}
    ${oTong('0', 'Nợ quá hạn', 'do', 'không có đợt nào trễ')}

  <div class="grid grid-cols-[1fr_1fr] gap-4 mb-4">
    <div class="khung"><div class="khung-dau"><h2>Các khoản phí</h2><span class="ml-auto">${nut('＋ Thêm khoản', 'phu', 'text-xs py-1')}</span></div>
      <div class="p-3"><table class="bang"><thead><tr><th>Loại</th><th>Khoản</th><th class="so">Số tiền (gồm VAT)</th></tr></thead><tbody>
        ${phi.map(([l, t, s]) => `<tr><td>${l === 'dich_vu' ? chip('Dịch vụ · doanh số', 'xanh') : chip('Thu hộ', 'cam')}</td><td>${t}</td><td class="so">${tien(s)}</td></tr>`).join('')}
        <tr class="tong"><td colspan="2">Tổng</td><td class="so">5.850.000</td></tr></tbody></table></div></div>

    <div class="khung"><div class="khung-dau"><h2>Lịch thu theo đợt</h2><span class="text-xs text-gray-500">mẫu "2 đợt: nhận hồ sơ / có kết quả"</span><span class="ml-auto">${nut('🧾 ĐNTT đợt 2', 'phu', 'text-xs py-1')}</span></div>
      <div class="p-3"><table class="bang"><thead><tr><th>Đợt</th><th>Đến hạn khi</th><th class="so">Dịch vụ</th><th class="so">Thu hộ</th><th class="so">Đã thu</th><th>Trạng thái</th></tr></thead><tbody>
        ${dot.map(([d, khi, ngay, dv, th, da, tt]) => `<tr><td class="font-semibold">${d}</td><td>${khi}<div class="text-[11px] text-gray-500">${ngay}</div></td><td class="so">${tien(dv)}</td><td class="so">${tien(th)}</td><td class="so font-semibold">${tien(da)}</td>
          <td>${tt === 'du' ? chip('Đã thu đủ', 'la') : chip('Chưa đến hạn', 'xam')}</td></tr>`).join('')}</tbody></table>
        <p class="text-[11.5px] text-gray-500 mt-2">Đợt đến hạn theo <b>bước</b> (tự bật khi hồ sơ sang bước đó) hoặc theo <b>ngày</b>. Đến hạn mới tính là công nợ phải thu.</p></div></div>
  </div>

  <div class="khung mb-4"><div class="khung-dau"><h2>Sổ thu tiền</h2><span class="text-xs text-gray-500">ghi nối tiếp — không sửa đè, xoá cần trưởng phòng + lý do</span><span class="ml-auto">${nut('＋ Ghi thu', 'chinh', 'text-xs py-1')}</span></div>
    <div class="p-3"><table class="bang"><thead><tr><th>Ngày khách trả</th><th>Cho đợt</th><th>Hình thức</th><th class="so">Số tiền</th><th class="so">→ Thu hộ</th><th class="so">→ Dịch vụ (doanh số)</th><th>Người ghi</th><th>Ghi chú</th></tr></thead><tbody>
      ${so.map(([n, d, ht, s, th, dv, ng, gc]) => `<tr><td class="font-semibold">${n}</td><td>${d}</td><td>${ht}</td><td class="so font-semibold">${tien(s)}</td><td class="so text-amber-800">${tien(th)}</td><td class="so text-blue-800 font-semibold">${tien(dv)}</td><td>${ng}</td><td class="text-[12px] text-gray-600">${gc}</td></tr>`).join('')}
    </tbody></table></div></div>

  <div class="khung border-dashed" style="border-color:#C9A84C">
    <div class="khung-dau"><h2>Ghi thu · khách trả thiếu (ví dụ minh hoạ)</h2><span class="ml-auto">${chip('Mặc định: trừ thu hộ trước', 'cam')}</span></div>
    <div class="p-4 grid grid-cols-[1fr_1.2fr] gap-6 items-start">
      <div class="grid grid-cols-2 gap-3">
        <div><span class="nhan">Ngày khách trả *</span><div class="o">05/11/2026</div></div>
        <div><span class="nhan">Cho đợt</span><div class="o">Đợt 1 — phải thu 4.000.000 ▾</div></div>
        <div><span class="nhan">Số tiền khách trả *</span><div class="o font-semibold">3.000.000</div></div>
        <div><span class="nhan">Hình thức</span><div class="o">Chuyển khoản ▾</div></div></div>
      <div class="rounded-lg bg-gray-50 border border-gray-200 p-3 text-[13px]">
        <p class="font-semibold mb-2">App tự tách (sửa được nếu khách chỉ định khác):</p>
        <div class="flex justify-between border-b border-gray-200 py-1"><span>Thu hộ của đợt (2.150.000) — trừ trước</span><b class="text-amber-800">2.150.000</b></div>
        <div class="flex justify-between border-b border-gray-200 py-1"><span>Phần còn lại vào phí dịch vụ</span><b class="text-blue-800">850.000</b></div>
        <div class="flex justify-between py-1"><span>Đợt 1 còn thiếu (dịch vụ)</span><b class="text-red-700">1.000.000</b></div>
        <p class="text-[11.5px] text-gray-500 mt-1">→ Doanh số tháng 11 tăng 850.000. Phần thiếu tiếp tục là công nợ của đợt 1.</p></div></div></div>` })
</script></body></html>
