<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>06 · Hồ sơ · Người & CCCD</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="_khung.js"></script></head>
<body><script>
// Mỗi người một thẻ: 2 ô ảnh CCCD (lưu trước, đọc sau — đọc lỗi không mất ảnh), các trường đọc được
// (xanh = Claude đọc, vàng = lệch khi kiểm chéo), và bảng kiểm chéo số CCCD ↔ ngày sinh ↔ giới tính ↔ MRZ.
const h = HO_SO[0]
const o = (nhan, gt, kieu = '', rong = 1) => `<div style="grid-column:span ${rong}"><span class="nhan">${nhan}</span><div class="o ${kieu}">${gt || '&nbsp;'}</div></div>`
// Ảnh minh hoạ trung tính (không mô phỏng thẻ thật)
const anh = (mat, co, ghi) => co
  ? `<div class="rounded-lg border border-gray-300 overflow-hidden bg-white"><div class="h-[104px] flex items-center justify-center" style="background:repeating-linear-gradient(135deg,#EEF2F7,#EEF2F7 10px,#E5EAF1 10px,#E5EAF1 20px)">
      <div class="text-center"><p class="text-2xl">🪪</p><p class="text-[11px] font-semibold text-slate-600">${mat}</p></div></div>
      <div class="px-2 py-1.5 flex items-center gap-1 text-[11px] border-t border-gray-200"><span class="text-emerald-700 font-semibold">✓ đã lưu</span><span class="text-gray-400">· ${ghi}</span><span class="ml-auto text-gray-500">👁 Xem</span></div></div>`
  : `<div class="rounded-lg border-2 border-dashed border-amber-300 bg-amber-50 h-[134px] flex flex-col items-center justify-center text-center px-2">
      <p class="text-xl">📷</p><p class="text-[12px] font-semibold text-amber-800">Tải ${mat.toLowerCase()}</p><p class="text-[11px] text-amber-700">kéo thả ảnh / chụp bằng điện thoại</p></div>`

const kiem = rows => `<table class="bang mt-1"><thead><tr><th>Kiểm chéo tự động</th><th>Kết quả</th></tr></thead><tbody>${rows.map(([t, ok, g]) => `<tr><td class="text-[12.5px]">${t}</td><td class="text-[12.5px] ${ok === true ? 'text-emerald-700' : ok === false ? 'text-amber-800 font-semibold' : 'text-gray-400'}">${ok === true ? '✓ ' : ok === false ? '⚠ ' : ''}${g}</td></tr>`).join('')}</tbody></table>`

const theNguoi = ({ vaiTro, mauVT, ten, truoc, sau, truong, kiemCheo, canhBao }) => `
  <div class="khung mb-4"><div class="khung-dau"><h2>${ten}</h2>${vaiTro.map(([v, m]) => chip(v, m)).join(' ')}
    <span class="ml-auto flex gap-2">${nut('↻ Đọc lại từ ảnh', 'phu', 'text-xs py-1')}${nut('✕ Bỏ người này', 'phu', 'text-xs py-1')}</span></div>
    <div class="p-4 grid grid-cols-[230px_1fr_330px] gap-4">
      <div class="space-y-2">${anh('Mặt trước', truoc, 'đọc 31/10 09:12')}${anh('Mặt sau', sau, 'đọc 31/10 09:12')}</div>
      <div><div class="grid grid-cols-3 gap-2.5">${truong}</div>
        ${canhBao ? `<div class="mt-3 rounded-lg border border-amber-300 bg-amber-50 px-3 py-2 text-[12.5px] text-amber-900">${canhBao}</div>` : ''}</div>
      <div>${kiemCheo}</div>
    </div></div>`

const nguoi1 = theNguoi({ ten: 'NGUYỄN THỊ MAI HƯƠNG', vaiTro: [['Chủ sở hữu', 'xanh'], ['Đại diện pháp luật · Giám đốc', 'tim']], truoc: true, sau: true,
  truong: o('Họ và tên', 'NGUYỄN THỊ MAI HƯƠNG', 'tu-dien', 2) + o('Giới tính', 'Nữ', 'tu-dien') +
    o('Ngày sinh', '14/03/1992', 'tu-dien') + o('Dân tộc', 'Kinh', 'can-xem') + o('Quốc tịch', 'Việt Nam', 'tu-dien') +
    o('Số CCCD', '079192 001234', 'tu-dien') + o('Ngày cấp', '22/12/2021', 'tu-dien') + o('Có giá trị đến', '14/03/2032', 'tu-dien') +
    o('Nơi cấp', 'Cục Cảnh sát quản lý hành chính về trật tự xã hội', 'tu-dien', 3) +
    o('Quê quán', 'Phường Long Bình, TP. Hồ Chí Minh', 'tu-dien', 3) +
    o('Thường trú', '45 đường số 7, Phường An Khánh, Thành phố Hồ Chí Minh', 'tu-dien', 3) +
    o('Địa chỉ liên lạc', 'Giống thường trú ☑', 'khoa', 2) + o('Điện thoại', '0909 1xx 234'),
  canhBao: '<b>Dân tộc</b> không in trên CCCD gắn chip — app để mặc định "Kinh", hỏi lại khách nếu khác.',
  kiemCheo: kiem([['Số CCCD đủ 12 chữ số', true, 'khớp'], ['3 số đầu 079 = nơi khai sinh TP. HCM', true, 'khớp'], ['Số thứ 4 (1) = nữ, sinh thế kỷ 20', true, 'khớp giới tính'], ['Số 5–6 (92) = năm sinh 1992', true, 'khớp ngày sinh'], ['Dòng MRZ mặt sau ↔ mặt trước', true, 'khớp số, ngày sinh, hạn'], ['Còn hạn tới ngày nộp', true, 'còn 5 năm 4 tháng']]) })

const nguoi2 = theNguoi({ ten: 'TRẦN QUỐC BẢO', vaiTro: [['Người phụ trách kế toán', 'cam']], truoc: true, sau: false,
  truong: o('Họ và tên', 'TRẦN QUỐC BẢO', 'tu-dien', 2) + o('Giới tính', 'Nam', 'tu-dien') +
    o('Ngày sinh', '02/09/1990', 'can-xem') + o('Dân tộc', 'Kinh', 'can-xem') + o('Quốc tịch', 'Việt Nam', 'tu-dien') +
    o('Số CCCD', '075090 005678', 'tu-dien') + o('Ngày cấp', '', 'thieu') + o('Có giá trị đến', '02/09/2030', 'tu-dien') +
    o('Nơi cấp', '', 'thieu', 3) + o('Thường trú', 'Ấp 3, Xã Phước An, Tỉnh Đồng Nai', 'tu-dien', 3),
  canhBao: 'Thiếu <b>mặt sau</b> nên chưa có ngày cấp, nơi cấp. <b>Ngày sinh</b> đọc được 02/09/1990 nhưng số CCCD cho năm sinh 90 — khớp; chỉ cần xác nhận ngày/tháng vì ảnh mờ ở dòng này.',
  kiemCheo: kiem([['Số CCCD đủ 12 chữ số', true, 'khớp'], ['3 số đầu 075 = nơi khai sinh Đồng Nai', true, 'khớp'], ['Số thứ 4 (0) = nam, thế kỷ 20', true, 'khớp giới tính'], ['Số 5–6 (90) = năm sinh 1990', true, 'khớp'], ['Dòng MRZ mặt sau ↔ mặt trước', null, 'chưa có mặt sau'], ['Độ rõ ảnh dòng ngày sinh', false, 'mờ — xác nhận tay']]) })

trang({ dangMo: 'hoso', icon: '📂', tieuDe: 'Chi tiết hồ sơ', noiDung: `
  ${dauHoSo(h)}
  ${tabDeu(TAB_HO_SO, 'Người & CCCD')}
  <div class="flex items-center gap-2 mb-3">
    <p class="text-[13px] text-gray-600">Bấm vào ô ảnh để tải lên — app <b>lưu ảnh trước</b> rồi mới đọc, đọc lỗi vẫn giữ ảnh. Ảnh CCCD tự xoá <b>24 tháng sau khi đóng hồ sơ</b>; mỗi lần mở xem đều ghi nhật ký.</p>
    <span class="ml-auto flex gap-2">${nut('＋ Thêm người')}${nut('🔁 Chọn người đã có trong hệ thống')}</span></div>
  ${nguoi1}${nguoi2}
  <div class="khung"><div class="khung-dau"><h2>Vai trò & vốn góp</h2><span class="ml-auto">${chip('Tổng 100% ✓', 'la')} ${chip('Tổng vốn khớp vốn điều lệ ✓', 'la')}</span></div>
    <div class="p-3"><table class="bang"><thead><tr><th>Người</th><th>Vai trò</th><th>Chức danh</th><th class="so">Giá trị góp (VNĐ)</th><th class="so">Tỷ lệ</th><th>Tài sản góp</th><th>Thời hạn góp</th></tr></thead><tbody>
      <tr><td class="font-semibold">NGUYỄN THỊ MAI HƯƠNG</td><td>Chủ sở hữu · Đại diện PL</td><td>Giám đốc</td><td class="so">1.000.000.000</td><td class="so font-bold">100%</td><td>Đồng Việt Nam</td><td class="text-gray-400 text-[12px]">không áp dụng với 1TV</td></tr>
      <tr><td class="font-semibold">TRẦN QUỐC BẢO</td><td>Phụ trách kế toán</td><td>Kế toán</td><td class="so text-gray-400">—</td><td class="so text-gray-400">—</td><td class="text-gray-400">—</td><td></td></tr></tbody></table>
    <p class="text-[11.5px] text-gray-500 mt-2">Chức danh <b>Giám đốc</b> → khi xuất Điều lệ app tự bỏ cụm "Tổng giám đốc" ở mọi điều khoản (theo ghi chú sẵn trong file mẫu của phòng).</p></div></div>` })
</script></body></html>
