<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>02 · Danh sách hồ sơ</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="_khung.js"></script></head>
<body><script>
const loc = (nhan, gt) => `<div><span class="nhan">${nhan}</span><div class="o flex items-center justify-between min-w-[150px]"><span>${gt}</span><span class="text-gray-400">▾</span></div></div>`
const dongTien = h => { const tong = h.phi + h.thuHo, con = tong - h.daThu
  return `<div class="leading-tight"><div class="tabular-nums text-[13px]">${tien(h.daThu)} <span class="text-gray-400">/ ${tien(tong)}</span></div>
    <div class="h-1.5 bg-gray-100 rounded-full mt-1 w-28"><div class="h-full rounded-full" style="width:${tong ? h.daThu / tong * 100 : 0}%;background:${con <= 0 ? '#047857' : '#B45309'}"></div></div></div>` }

trang({ dangMo: 'hoso', icon: '📂', tieuDe: 'Hồ sơ pháp lý', phu: 'Mỗi dòng là một vụ việc của một doanh nghiệp. Bấm vào dòng để mở hồ sơ.',
  hanhDong: `${nut('⬇ Excel')}${nut('＋ Tiếp nhận hồ sơ', 'chinh')}`,
  noiDung: `
  ${tabDeu([['📂', 'Đang xử lý', 10], ['⏳', 'Chờ khách / cơ quan', 6], ['⚠️', 'Trễ hạn', 3], ['✅', 'Đã đóng', 41], ['🗂️', 'Tất cả', 52]], 'Đang xử lý')}

  <div class="khung px-4 py-3 mb-4 flex items-end gap-3 flex-wrap">
    <div class="flex-1 min-w-[260px]"><span class="nhan">Tìm</span><div class="o text-gray-400">🔍 Tên công ty, MST, mã hồ sơ, tên người đại diện…</div></div>
    ${loc('Thủ tục', 'Tất cả thủ tục')}${loc('Loại hình', 'Tất cả')}${loc('Bước', 'Tất cả bước')}${loc('Chuyên viên', 'Cả phòng')}${loc('Nhận trong', 'Tháng 10/2026')}
    <div class="ml-auto flex rounded-lg border border-gray-300 overflow-hidden text-sm"><span class="px-3 py-1.5 text-white font-semibold" style="background:${DO}">☰ Danh sách</span><span class="px-3 py-1.5 bg-white text-gray-600">▦ Theo bước</span></div>
  </div>

  <div class="khung p-3"><div class="overflow-auto" style="max-height:640px">
  <table class="bang"><thead><tr>
    <th>Mã</th><th>Doanh nghiệp</th><th>Thủ tục</th><th>Loại hình</th><th>Bước hiện tại</th><th>Đang chờ</th><th>Hạn nội bộ</th><th>Phụ trách</th><th>Đã thu / Phải thu</th></tr></thead>
  <tbody>${HO_SO.filter(h => h.buoc !== 'dong').map(h => {
    const [tt, mt] = THU_TUC[h.tt]
    const i = BUOC.findIndex(b => b[0] === h.buoc)
    return `<tr>
      <td class="font-mono text-xs font-semibold text-gray-700 whitespace-nowrap">${h.ma}</td>
      <td><p class="font-semibold text-gray-900 text-[13px]">${h.kh}</p><p class="text-[11.5px] text-gray-500">Nhận ${h.nhan}/2026</p></td>
      <td>${chip(tt, mt)}</td><td class="text-gray-700">${LOAI[h.loai]}</td>
      <td><div class="flex items-center gap-2"><span class="text-[11px] font-bold w-5 h-5 rounded-full inline-flex items-center justify-center text-white" style="background:${DO}">${i + 1}</span><span class="font-medium">${tenBuoc(h.buoc)}</span></div></td>
      <td>${h.cho ? chip(CHO[h.cho][0], CHO[h.cho][1]) : '<span class="text-gray-300">—</span>'}</td>
      <td class="${h.con < 0 ? 'text-red-700 font-bold' : h.con <= 3 ? 'text-amber-700 font-semibold' : ''}">${h.han}/2026<div class="text-[11px] font-normal">${h.con < 0 ? 'trễ ' + (-h.con) + ' ngày' : 'còn ' + h.con + ' ngày'}</div></td>
      <td>${nguoi(h.nv)}</td><td>${dongTien(h)}</td></tr>` }).join('')}</tbody></table></div></div>

  <p class="text-xs text-gray-500 mt-3">Màu hạn: <b class="text-red-700">đỏ</b> = đã trễ, <b class="text-amber-700">cam</b> = còn ≤ 3 ngày. Hạn nội bộ đếm ngày lịch, bỏ chủ nhật (giống HCNS). Thanh tiền xanh = đã thu đủ.</p>` })
</script></body></html>
