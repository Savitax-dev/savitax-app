<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Savitax Hồ Sơ — bản demo giao diện</title>
<!--
  BẢN DEMO GIAO DIỆN — dữ liệu GIẢ, chưa nối bộ máy thật.
  Cố ý không gọi mạng (không CDN, không Google Fonts) để thử đúng điều kiện bản thật: mở thẳng từ ổ đĩa.
  Nút "Trỏ thư mục" gọi thật File System Access ở chế độ CHỈ ĐỌC để thử trên file://.
-->
<style>
:root {
  --do: #8B1A1A; --do2: #6B1212; --vang: #C9A84C; --vang-soft: #fbf5e6;
  --bg: #f6f7f9; --panel: #ffffff; --panel2: #f9fafb; --ink: #1f2937; --muted: #6b7280; --line: #e5e7eb; --line2: #f1f2f4;
  --do-soft: #fbeeee; --ok: #047857; --ok-soft: #ecfdf5; --warn: #b45309; --warn-soft: #fffbeb; --err: #b91c1c; --err-soft: #fef2f2;
  --info: #1d4ed8; --info-soft: #eff6ff; --tim: #6d28d9; --tim-soft: #f5f3ff;
  --paper: #ffffff; --paper-ink: #111111;
  --shadow: 0 1px 2px rgba(17,24,39,.05), 0 4px 14px rgba(17,24,39,.05);
  --ui: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  --doc: "Times New Roman", Tinos, Times, serif;
}
:root[data-theme="dark"] {
  --bg: #111418; --panel: #1a1f26; --panel2: #20262e; --ink: #e6e8eb; --muted: #9aa3ad; --line: #2c333c; --line2: #242a32;
  --do-soft: #3a1a1a; --vang-soft: #33291a; --ok: #4ade80; --ok-soft: #12291c; --warn: #fbbf24; --warn-soft: #2f240e;
  --err: #f87171; --err-soft: #331616; --info: #93c5fd; --info-soft: #14233a; --tim: #c4b5fd; --tim-soft: #241c3a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--ui) }
button, input, select, textarea { font: inherit; color: inherit }
h1, h2, h3, h4 { margin: 0; line-height: 1.3 }
.num { font-variant-numeric: tabular-nums }
.muted { color: var(--muted) } .small { font-size: 12px }

/* ---------- Khung: menu trái + vùng làm việc ---------- */
.app { display: flex; min-height: 100vh }
aside { width: 256px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh }
.band { background: linear-gradient(90deg, var(--do), var(--do2)); padding: 12px 14px; display: flex; gap: 10px; align-items: center }
.band .logo { width: 42px; height: 42px; border-radius: 9px; background: #fff; padding: 2px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; box-shadow: 0 2px 6px rgba(0,0,0,.2) }
.band .logo img { max-width: 100%; max-height: 100%; object-fit: contain }
.band b { color: #fff; font-size: 13px; letter-spacing: .3px; display: block; line-height: 1.25; text-transform: uppercase }
.band span { color: #fecaca; font-size: 11px }
.ctybox { padding: 10px 12px; background: var(--vang-soft); border-bottom: 1px solid var(--line) }
.ctybox label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 3px }
.ctybox select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-size: 13px; font-weight: 600 }
nav { flex: 1; overflow-y: auto; padding: 8px 10px }
.sec-label { display: flex; align-items: center; gap: 8px; padding: 12px 4px 6px }
.sec-label::before, .sec-label::after { content: ""; height: 1px; flex: 1; background: linear-gradient(to right, transparent, #C9A84C80, transparent) }
.sec-label p { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--vang) }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 9px 11px; border-radius: 11px; font-size: 13.5px; font-weight: 500; color: var(--muted); cursor: pointer }
.nav-item:hover { background: var(--do-soft); color: var(--do) }
.nav-item.on { background: var(--do); color: #fff; box-shadow: 0 1px 3px rgba(139,26,26,.3) }
.nav-item .ic { font-size: 17px; width: 22px; text-align: center }
.foot { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); line-height: 1.45 }
.foot b { color: var(--do) }
main { flex: 1; min-width: 0; padding: 18px 22px 40px }

/* ---------- Thành phần ---------- */
.head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap }
.head .ic { font-size: 26px }
.head h1 { font-size: 20px }
.head .right { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; border: 1px solid; padding: 2px 9px; font-size: 11.5px; font-weight: 600; white-space: nowrap }
.pill.ok { color: var(--ok); background: var(--ok-soft); border-color: #a7f3d0 }
.pill.warn { color: var(--warn); background: var(--warn-soft); border-color: #fde68a }
.pill.err { color: var(--err); background: var(--err-soft); border-color: #fecaca }
.pill.info { color: var(--info); background: var(--info-soft); border-color: #bfdbfe }
.pill.tim { color: var(--tim); background: var(--tim-soft); border-color: #ddd6fe }
.pill.xam { color: var(--muted); background: var(--panel2); border-color: var(--line) }
:root[data-theme="dark"] .pill { border-color: var(--line) }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 7px; border: 1px solid; padding: 1px 7px; font-size: 12px; font-weight: 500; white-space: nowrap }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50% ; background: currentColor }
.chip.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent }
.chip.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent }
.chip.err { color: var(--err); background: var(--err-soft); border-color: transparent }
.chip.info { color: var(--info); background: var(--info-soft); border-color: transparent }
.chip.xam { color: var(--muted); background: var(--panel2); border-color: transparent }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); padding: 7px 13px; border-radius: 11px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap }
.btn:hover { border-color: var(--do); color: var(--do) }
.btn.pri { background: var(--do); color: #fff; border-color: var(--do) }
.btn.pri:hover { background: var(--do2); color: #fff }
.btn.vang { background: var(--vang); color: #fff; border-color: var(--vang) }
.btn.sm { padding: 4px 10px; font-size: 12px; border-radius: 9px }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 14px 16px }
.card + .card { margin-top: 12px }
.card h3 { font-size: 14.5px; margin-bottom: 8px }
.grid { display: grid; gap: 12px }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)) } .g3 { grid-template-columns: repeat(3, minmax(0,1fr)) } .g4 { grid-template-columns: repeat(4, minmax(0,1fr)) }
.g-main { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) }

/* Thanh công ty (giống ThanhCongTy trong app) */
.ctybar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 9px 12px; margin-bottom: 12px }
.ctybar .ten { font-weight: 700 }
.ctybar .path { font-size: 12px; color: var(--muted); font-family: Consolas, monospace; background: var(--panel2); padding: 2px 8px; border-radius: 6px; max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ctybar .right { margin-left: auto; display: flex; gap: 6px }

/* Tab gạch chân đỏ đô, chia đều 1 khung */
.tabs { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 12px }
.tabs button { flex: 1; border: 0; background: none; padding: 10px 8px 9px; cursor: pointer; border-bottom: 3px solid transparent; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0 }
.tabs button + button { border-left: 1px solid var(--line2) }
.tabs button small { font-weight: 400; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100% }
.tabs button:hover { background: var(--panel2) }
.tabs button.on { color: var(--do); border-bottom-color: var(--do); background: var(--do-soft) }

/* Ô tổng */
.otong { border-radius: 16px; background: var(--panel); border: 1px solid var(--line); overflow: hidden; box-shadow: var(--shadow) }
.otong .bar { height: 6px }
.otong .in { padding: 10px 14px 12px }
.otong .so { font-size: 24px; font-weight: 800 }
.otong .nh { font-size: 12.5px; color: var(--muted); font-weight: 600 }

/* Bảng: dòng xen màu, kẻ dọc, tiêu đề dính */
.tblwrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; max-height: 70vh }
table.t { width: 100%; border-collapse: collapse; font-size: 13px }
.t th { position: sticky; top: 0; background: var(--do); color: #fff; font-weight: 600; text-align: left; padding: 8px 10px; white-space: nowrap; z-index: 1 }
.t td { padding: 7px 10px; border-top: 1px solid var(--line2); border-left: 1px solid var(--line2); vertical-align: top }
.t td:first-child { border-left: 0 }
.t tbody tr:nth-child(even) td { background: var(--panel2) }
.t tbody tr:hover td { background: var(--vang-soft) }
.t .r { text-align: right } .t .c { text-align: center }
.t tr.tong td { font-weight: 700; background: var(--vang-soft) !important }

/* Thông báo */
.bao { border-radius: 12px; padding: 9px 12px; font-size: 13px; border: 1px solid; margin-bottom: 12px }
.bao.info { background: var(--info-soft); color: var(--info); border-color: #bfdbfe }
.bao.warn { background: var(--warn-soft); color: var(--warn); border-color: #fde68a }
.bao.ok { background: var(--ok-soft); color: var(--ok); border-color: #a7f3d0 }
:root[data-theme="dark"] .bao { border-color: var(--line) }

/* Hồ sơ chứng từ */
.drop { display: block; border: 2px dashed var(--vang); background: var(--vang-soft); border-radius: 14px; padding: 18px; text-align: center; cursor: pointer }
.step { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px }
.step .k { font-weight: 700; color: var(--do); font-size: 13px }
.f { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted) }
.f input, .f select, .f textarea, .inp { border: 1px solid var(--line); border-radius: 9px; padding: 6px 9px; background: var(--panel); color: var(--ink); font-size: 13px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden }
.seg button { border: 0; background: var(--panel); padding: 5px 12px; cursor: pointer; font-size: 13px }
.seg button.on { background: var(--do); color: #fff }
.ck { display: flex; align-items: center; gap: 9px; padding: 7px 4px; border-bottom: 1px dashed var(--line) }
.ck .box { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; flex-shrink: 0 }
.ck .box.on { background: var(--ok); border-color: var(--ok) }
.ck .box.miss { border-color: var(--err) }
.ring { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0 }
.ring span { background: var(--panel); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px }
.doctabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 8px 0 }
.doctabs button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 3px 9px; font-size: 12px; cursor: pointer }
.doctabs button.on { border-color: var(--do); color: var(--do); background: var(--do-soft); font-weight: 600 }
.paperwrap { background: #e9ebee; border-radius: 12px; padding: 16px; max-height: 620px; overflow: auto }
:root[data-theme="dark"] .paperwrap { background: #0b0d10 }
.paper { background: var(--paper); color: var(--paper-ink); font: 13px/1.5 var(--doc); width: 100%; max-width: 560px; margin: 0 auto; padding: 34px 40px; box-shadow: 0 2px 10px rgba(0,0,0,.15); min-height: 700px }
.paper .qh { display: flex; justify-content: space-between; text-align: center; font-size: 12px }
.paper .qh b { display: block }
.paper h2 { text-align: center; font-size: 17px; margin: 18px 0 2px }
.paper .so { text-align: center; font-style: italic; font-size: 12px; margin-bottom: 14px }
.paper .var { background: #e0f2fe; border-radius: 2px; padding: 0 2px }
.paper table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 12px }
.paper td, .paper th { border: 1px solid #333; padding: 3px 5px }
.paper .ky { display: flex; justify-content: space-around; text-align: center; margin-top: 30px; font-weight: 700 }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 12px }
.bars .bar1 { display: grid; grid-template-columns: 150px 1fr 40px; gap: 8px; align-items: center; font-size: 12.5px; margin: 5px 0 }
.bars .track { height: 9px; background: var(--line2); border-radius: 9px; overflow: hidden }
.bars .fill { height: 100%; background: linear-gradient(90deg, var(--do), var(--vang)); border-radius: 9px }

/* Cài đặt */
.logo-edit { display: flex; gap: 14px; align-items: center }
.logo-edit .prev { width: 88px; height: 88px; border: 1px dashed var(--line); border-radius: 14px; display: flex; align-items: center; justify-content: center; background: #fff; overflow: hidden }
.logo-edit .prev img { max-width: 100%; max-height: 100% }
.lock { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 12.5px }

/* Hướng dẫn */
.hd { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; align-items: start }
.hd .card p { margin: 0 0 8px }
.buoc { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line) }
.buoc:last-child { border-bottom: 0 }
.buoc .so { width: 30px; height: 30px; border-radius: 50%; background: var(--do); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center }
.buoc > div > b:first-child { display: block; margin-bottom: 2px }
.buoc ul, .card ul.g { margin: 4px 0 0; padding-left: 18px } .buoc li, .card ul.g li { margin: 2px 0 }
code { font-family: Consolas, monospace; font-size: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px }
.tai { background: linear-gradient(135deg, var(--do), var(--do2)); color: #fff; border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow) }
.tai h3 { color: #fff; margin-bottom: 4px } .tai p { color: #fde2e2; font-size: 12.5px; margin: 0 0 10px }
.tai .btn { background: var(--vang); border-color: var(--vang); color: #fff }
.cay { font-size: 12.5px; max-height: 560px; overflow: auto; padding-right: 4px }
.cay .n { display: flex; align-items: center; gap: 5px; padding: 2px 4px; border-radius: 6px; white-space: nowrap; cursor: default }
.cay .n:hover { background: var(--vang-soft) }
.cay .n.co-con { cursor: pointer; list-style: none }
.cay summary::-webkit-details-marker { display: none }
.cay summary::marker { content: "" }
.cay details[open] > summary .mui { transform: rotate(90deg) }
.cay .mui { width: 12px; color: var(--muted); font-size: 10px; flex-shrink: 0 }
.cay .doc { margin-left: auto; font-size: 10.5px; font-weight: 700; color: var(--ok); background: var(--ok-soft); border-radius: 5px; padding: 0 5px }
.cay .doi { margin-left: auto; font-size: 10.5px; font-weight: 700; color: var(--warn); background: var(--warn-soft); border-radius: 5px; padding: 0 5px }
details.muc { border: 1px solid var(--line); border-radius: 12px; margin-top: 8px; background: var(--panel) }
details.muc > summary { list-style: none; cursor: pointer; padding: 9px 12px; display: flex; align-items: center; gap: 8px; font-weight: 700 }
details.muc > summary::-webkit-details-marker { display: none }
details.muc > summary::marker { content: "" }
details.muc > summary .mui { color: var(--muted); font-size: 10px; transition: transform .15s }
details.muc[open] > summary .mui { transform: rotate(90deg) }
details.muc[open] > summary { border-bottom: 1px solid var(--line); background: var(--do-soft); border-radius: 12px 12px 0 0; color: var(--do) }
details.muc > summary .mo { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 4px }
details.muc > summary .doc { margin-left: auto; font-size: 10.5px; font-weight: 700; color: var(--ok); background: var(--ok-soft); border-radius: 5px; padding: 0 6px }
details.muc .than { padding: 10px 12px }
details.muc pre { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: 12px/1.5 Consolas, monospace; margin: 0 0 8px; overflow: auto }
details.muc .t td:last-child { font-family: Consolas, monospace; font-size: 12px }
@media (max-width: 900px) { .hd { grid-template-columns: 1fr } }

.toast { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 99 }
.toast div { background: #1f2937; color: #fff; padding: 9px 14px; border-radius: 10px; font-size: 13px; box-shadow: 0 6px 18px rgba(0,0,0,.25); max-width: 380px }
/* Hộp thoại thêm / sửa công ty */
.nen-hop { position: fixed; inset: 0; background: rgba(17,24,39,.45); display: flex; align-items: flex-start; justify-content: center; padding: 60px 16px; z-index: 80; overflow: auto }
.hop { background: var(--panel); border-radius: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.3); width: 100%; max-width: 560px; overflow: hidden }
.hop .dau { background: linear-gradient(90deg, var(--do), var(--do2)); color: #fff; padding: 12px 16px; font-weight: 700; display: flex; align-items: center }
.hop .dau button { margin-left: auto; background: none; border: 0; color: #fff; font-size: 20px; cursor: pointer; line-height: 1 }
.hop .than { padding: 14px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.hop .than .rong { grid-column: 1 / -1 }
.hop .loi { grid-column: 1 / -1; color: var(--err); background: var(--err-soft); border-radius: 8px; padding: 6px 10px; font-size: 12.5px }
.hop .chan { padding: 10px 16px 14px; display: flex; gap: 8px; border-top: 1px solid var(--line) }
.hop label.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink) }
.o-mst { position: relative; display: block }
.o-mst input { width: 100%; padding-right: 40px }
.o-mst button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 32px; height: 28px; border: 0; border-radius: 7px; background: var(--do); color: #fff; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center }
.o-mst button:hover { background: var(--do2) }
.o-mst button[disabled] { opacity: .6; cursor: wait }
.tra-kq { grid-column: 1 / -1; font-size: 12.5px; border-radius: 8px; padding: 6px 10px; background: var(--panel2); border: 1px solid var(--line) }
.tra-kq.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent }
.tra-kq.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent }
.tra-kq.err { background: var(--err-soft); color: var(--err); border-color: transparent }
.demo-tag { position: fixed; bottom: 10px; left: 270px; background: var(--vang); color: #fff; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; z-index: 50; letter-spacing: .3px }

@media (max-width: 900px) {
  .app { flex-direction: column } aside { width: 100%; height: auto; position: static }
  nav { display: flex; flex-wrap: wrap; gap: 4px } .nav-item { width: auto } .sec-label { display: none }
  main { padding: 14px 16px 40px }
  .g2, .g3, .g4, .g-main, .kpis { grid-template-columns: 1fr }
  .tabs { overflow-x: auto } .tabs button { min-width: 120px }
}
</style>
</head>
<body>
<div class="demo-tag">BẢN DEMO · DỮ LIỆU GIẢ</div>
<div class="app">
  <aside>
    <div class="band">
      <div class="logo"><img id="bandLogo" alt="Logo"></div>
      <div><b id="bandTen">SAVITAX</b><span>Soát xét · Rủi ro thuế · Hồ sơ chứng từ</span></div>
    </div>
    <div class="ctybox"><label for="ctySel">Công ty đang làm</label><select id="ctySel"></select></div>
    <nav id="nav"></nav>
    <div class="foot">Bản quyền © <b>Savitax</b> · v1.0<br>Chạy trên máy · không cần mạng · dữ liệu ở trình duyệt này<br><a href="cau-truc-chay.html" style="color:var(--do)">📐 Xem cấu trúc chạy (bản demo)</a></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>

const escTen = (s) => s.replace(/</g, "&lt;").replace(/>/g, "&gt;");
function veQuyTac() {
  return QT.map((q) => `<details class="muc" ${q.so === 7 ? "open" : ""}><summary><span class="mui">▶</span>${q.so}. ${q.ten}<span class="mo">— ${q.mo}</span>${q.doc ? '<span class="doc">app đọc</span>' : ""}</summary><div class="than">

const VIEW = { home: vHome, cty: vCty, soat: vSoat, ruiro: vRuiRo, ct: vCt, cai: vCai };
function ve() {
  veMenu();
  $("main").innerHTML = VIEW[S.mod]();
  if (S.mod === "cai") kiemMay();
  const h = "#/" + S.mod + (S.tab[S.mod] ? "/" + S.tab[S.mod] : "");
  if (location.hash !== h) history.replaceState(null, "", h);
}
function docHash() {
  const [, mod, tab] = (location.hash || "").split("/");
  if (mod && VIEW[mod]) { S.mod = mod; if (tab) S.tab[mod] = tab; }
}
function kiemMay() {
  const dong = [
    ["Mở từ ổ đĩa (file://)", location.protocol === "file:"],
    ["Môi trường an toàn (isSecureContext)", window.isSecureContext],
    ["Trỏ thư mục (File System Access)", "showDirectoryPicker" in window],
    ["Kho trên máy (IndexedDB)", "indexedDB" in window],
  ];
  $("kiemMay").innerHTML = dong.map(([t, ok]) => `<div>${ok ? "✅" : "❌"} ${t}</div>`).join("");
}
async function thuTroThuMuc() {
  if (!("showDirectoryPicker" in window)) { toast("Trình duyệt này không trỏ được thư mục — dùng Chrome hoặc Edge."); return; }
  try {
    const tc = await window.showDirectoryPicker({ mode: "read" });
    let n = 0, ten = [];
    for await (const [k] of tc.entries()) { n++; if (ten.length < 4) ten.push(k); }
    toast(`Đọc được thư mục "${tc.name}": ${n} mục (${ten.join(", ")}${n > 4 ? "…" : ""}). Chỉ đọc, không ghi gì.`);
  } catch (e) { if (e.name !== "AbortError") toast("Không đọc được: " + e.message); }
}

// i = số thứ tự công ty đang sửa; không có i = thêm mới
function moHopCty(i) {

    <div class="than">
      <label class="f">Mã KH *<input id="fMa" value="${esc(c.ma)}" placeholder="KH005"></label>
      <div class="f">MST *<span class="o-mst"><input id="fMst" value="${esc(c.mst)}" inputmode="numeric" placeholder="10 hoặc 13 số" aria-label="Mã số thuế"><button type="button" data-act="traMst" title="Tra MST: tìm tên, địa chỉ (Enter)" aria-label="Tra mã số thuế">🔍</button></span></div>
      <div class="tra-kq" id="fTra">Gõ MST rồi bấm 🔍 (hoặc Enter) — app tìm trong danh sách trên máy trước, không có thì tra trên mạng.</div>
      <label class="f rong">Tên công ty *<input id="fTen" value="${esc(c.ten)}" placeholder="CÔNG TY TNHH …"></label>
      <label class="f rong">Địa chỉ<input id="fDc" value="${esc(c.dc || "")}" placeholder="In vào chứng từ (Bên A)"></label>
      <label class="f">Kỳ khai thuế<select id="fKy"><option ${c.ky === "Quý" ? "selected" : ""}>Quý</option><option ${c.ky === "Tháng" ? "selected" : ""}>Tháng</option></select></label>
      <label class="f">Phí / tháng (gồm VAT)<input id="fPhi" value="${c.phi === "" ? "" : fmt(c.phi)}" inputmode="numeric" placeholder="2.160.000"></label>
      <label class="chk rong"><input type="checkbox" id="fHkd" ${c.hkd ? "checked" : ""}> Hộ kinh doanh</label>
      <div class="loi" id="fLoi" hidden></div>
    </div>
    <div class="chan"><button class="btn pri" data-act="luuCty" data-i="${i ?? ""}">Lưu</button><button class="btn" data-act="dongHop">Huỷ</button>
      ${i == null ? "" : `<button class="btn" data-act="xoaCty" data-i="${i}" style="margin-left:auto;color:var(--err)">Xoá công ty</button>`}</div></div>`;
  document.body.appendChild(d);
  $("fMa").focus();
}
function dongHop() { $("hopCty")?.remove(); }
function luuHopCty(iStr) {
  const i = iStr === "" ? null : +iStr;
  const ma = $("fMa").value.trim().toUpperCase(), ten = $("fTen").value.trim().toUpperCase();
  const mst = $("fMst").value.replace(/[\s.]/g, ""), phiTxt = $("fPhi").value.replace(/[^\d]/g, "");
  const loi = [];
  if (!ma) loi.push("Thiếu mã KH.");
  else if (CTY.some((c, k) => k !== i && c.ma === ma)) loi.push(`Mã KH "${ma}" đã có.`);
  if (!ten) loi.push("Thiếu tên công ty.");
  if (!/^\d{10}(-?\d{3})?$/.test(mst)) loi.push("MST phải 10 số, hoặc 13 số (10 số + 3 số chi nhánh).");
  else if (CTY.some((c, k) => k !== i && c.mst.replace(/-/g, "") === mst.replace(/-/g, ""))) loi.push(`MST ${mst} đã có ở công ty khác.`);
  if (loi.length) { $("fLoi").hidden = false; $("fLoi").innerHTML = loi.join("<br>"); return; }
  const moi = { ma, ten, mst, dc: $("fDc").value.trim(), ky: $("fKy").value, hkd: $("fHkd").checked, phi: phiTxt ? +phiTxt : 0 };
  if (i == null) { CTY.push({ ...moi, thuMuc: "" }); S.cty = CTY.length - 1; toast(`Đã thêm ${ma}. Bước tiếp: chọn công ty rồi bấm Trỏ thư mục.`); }
  else { Object.assign(CTY[i], moi); toast(`Đã lưu ${ma}.`); }
  luuCty(); dongHop();
}
// Đối tác app đã học từ hóa đơn (demo: dữ liệu giả, cùng bảng "Đối tác" ở Danh sách công ty)
const DOI_TAC = [
  { mst: "9999100001", ten: "CÔNG TY TNHH VẬT LIỆU MẪU HƯNG THỊNH", dc: "Số 12 Đường Mẫu, Phường Mẫu, TP. Mẫu" },
  { mst: "9999100002", ten: "CÔNG TY CP THIẾT BỊ MẪU NAM VIỆT", dc: "Số 34 Đường Mẫu, Phường Mẫu, TP. Mẫu" },
  { mst: "9999100003", ten: "CÔNG TY TNHH VẬN TẢI MẪU SAO MAI", dc: "" },
];
// Tra MST: 1) danh sách trên máy (không cần mạng) → 2) tra mạng (VietQR, dữ liệu tổng hợp từ trang Cục Thuế).
// Chỉ gửi đi MÃ SỐ THUẾ (thông tin công khai), không gửi gì khác.
async function traMst() {
  const o = $("fTra"), nut = document.querySelector('[data-act="traMst"]');
  const bao = (lop, html) => { o.className = "tra-kq " + lop; o.innerHTML = html; };
  const mst = $("fMst").value.replace(/[\s.]/g, "");
  if (!/^\d{10}(-?\d{3})?$/.test(mst)) { bao("err", "MST phải 10 số, hoặc 13 số (10 số + 3 số chi nhánh)."); $("fMst").focus(); return; }
  const dangSua = $("hopCty").querySelector('[data-act="luuCty"]').dataset.i;
  const goc = mst.replace(/-/g, "");
  const trung = CTY.findIndex((c, k) => String(k) !== dangSua && c.mst.replace(/-/g, "") === goc);
  if (trung >= 0) { bao("warn", `MST này đã có trong danh sách: <b>${esc(CTY[trung].ma)} · ${esc(CTY[trung].ten)}</b>.`); return; }
  const dt = DOI_TAC.find((d) => d.mst === goc);
  if (dt) { $("fTen").value = dt.ten; if (dt.dc) $("fDc").value = dt.dc; bao("ok", "✓ Lấy từ danh sách đối tác trên máy (đã gặp trong hóa đơn)."); return; }
  nut.disabled = true; bao("", "Đang tra trên mạng…");
  const mstTra = mst.length > 10 && !mst.includes("-") ? mst.slice(0, 10) + "-" + mst.slice(10) : mst;
  try {
    const hen = new AbortController(); const t = setTimeout(() => hen.abort(), 8000);
    const r = await fetch("https://api.vietqr.io/v2/business/" + encodeURIComponent(mstTra), { signal: hen.signal });
    clearTimeout(t);
    if (r.status === 429) { bao("warn", "Tra quá nhanh — đợi vài giây rồi bấm lại."); return; }
    const j = await r.json();
    if (j.code === "00" && j.data) {
      $("fTen").value = String(j.data.name || "").toUpperCase();
      if (j.data.address) $("fDc").value = j.data.address;
      const conHd = /đang hoạt động/i.test(j.data.status || "");
      const ngay = j.metadata?.updatedAt ? new Date(j.metadata.updatedAt).toLocaleDateString("vi-VN") : "";
      bao(conHd ? "ok" : "err", `${conHd ? "✓" : "⚠"} ${esc(j.data.status || "Không rõ trạng thái")} — theo dữ liệu Cục Thuế${ngay ? " (cập nhật " + ngay + ")" : ""}. Kiểm lại tên trước khi lưu.`);
    } else if (j.code === "51") bao("err", "MST không tồn tại trên dữ liệu Cục Thuế — kiểm lại số.");
    else bao("warn", "Không tra được (" + esc(j.desc || "lỗi lạ") + ") — gõ tay tên công ty.");
  } catch (e) {
    bao("warn", "Không tra được trên mạng (máy không có mạng hoặc dịch vụ tra bận) — gõ tay tên công ty.");
  } finally { nut.disabled = false; }
}
function xoaHopCty(i) {
  if (CTY.length <= 1) { toast("Phải còn ít nhất một công ty."); return; }
  if (!confirm(`Xoá công ty ${CTY[i].ma} khỏi danh sách? Thư mục trên ổ chung không bị đụng tới.`)) return;
  const ma = CTY[i].ma; CTY.splice(i, 1);
  if (S.cty >= CTY.length) S.cty = CTY.length - 1;
  luuCty(); dongHop(); toast(`Đã xoá ${ma} khỏi danh sách.`);
}

document.addEventListener("keydown", (e) => {
  if (!$("hopCty")) return;
  if (e.key === "Escape") dongHop();
  if (e.key === "Enter" && e.target.id === "fMst") { e.preventDefault(); traMst(); return; }
  if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); document.querySelector('#hopCty [data-act="luuCty"]').click(); }
});
document.addEventListener("click", (e) => {
  if (e.target.id === "hopCty") { dongHop(); return; } // bấm ra ngoài hộp
  const b = e.target.closest("[data-mod],[data-go],[data-tab],[data-doc],[data-theme],[data-act]");
  if (!b) {
    // Nút trong bản demo chưa gắn việc: báo rõ thay vì im lặng
    const nut = e.target.closest("button.btn");
    if (nut) toast(`Bản demo: nút "${nut.textContent.trim()}" chưa chạy — bản thật mới có.`);
    return;
  }
  if (b.dataset.act === "themCty") { moHopCty(); return; }
  if (b.dataset.act === "suaCty") { moHopCty(+b.dataset.i); return; }
  if (b.dataset.act === "dongHop") { dongHop(); return; }
  if (b.dataset.act === "traMst") { traMst(); return; }
  if (b.dataset.act === "luuCty") { luuHopCty(b.dataset.i); if ($("hopCty")) return; luu(); ve(); return; }
  if (b.dataset.act === "xoaCty") { xoaHopCty(+b.dataset.i); if ($("hopCty")) return; luu(); ve(); return; }
  if (b.dataset.mod || b.dataset.go) { S.mod = b.dataset.mod || b.dataset.go; }
  else if (b.dataset.tab) { S.tab[S.mod] = b.dataset.tab; }
  else if (b.dataset.doc) { S.docTab = +b.dataset.doc; }
  else if (b.dataset.theme !== undefined) { S.theme = b.dataset.theme; }
  else if (b.dataset.act === "tro") { thuTroThuMuc(); return; }
  else if (b.dataset.act === "taiCay") { taiCay(); return; }
  else if (b.dataset.act === "taiLai") { toast("Bản thật: đọc lại thư mục, bỏ bộ nhớ đệm của công ty này."); return; }
  else if (b.dataset.act === "logoXoa") { S.logo = ""; }
  else if (b.dataset.act === "luuTh") { S.tenKhach = $("tenKhach").value.trim(); S.mstKhach = $("mstKhach").value.trim(); S.dcKhach = $("dcKhach").value.trim(); toast("Đã lưu thương hiệu."); }
  luu(); ve(); window.scrollTo(0, 0);
});
document.addEventListener("change", (e) => {
  if (e.target.id === "ctySel") { S.cty = +e.target.value; luu(); ve(); }
  if (e.target.id === "logoIn" && e.target.files[0]) {
    const f = e.target.files[0];
    if (f.size > 500 * 1024) { toast("Logo nên dưới 500 KB."); return; }
    const r = new FileReader(); r.onload = () => { S.logo = r.result; luu(); ve(); toast("Đã đổi logo."); }; r.readAsDataURL(f);
  }
});
window.addEventListener("hashchange", () => { docHash(); ve(); });
docHash(); ve();
</script>
</body>
